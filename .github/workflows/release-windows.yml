name: Release Windows

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Restore optional server configuration
        shell: pwsh
        env:
          SERVER_CONFIG: ${{ secrets.DICTIONARY_SERVER_JSON_B64 }}
          SERVER_CA_CERTIFICATE: ${{ secrets.DICTIONARY_SERVER_CA_PEM_B64 }}
        run: |
          if (-not $env:SERVER_CONFIG) {
            throw "The DICTIONARY_SERVER_JSON_B64 secret is required to build a server-connected release"
          }
          [IO.File]::WriteAllBytes("dictionary-server.json", [Convert]::FromBase64String($env:SERVER_CONFIG))
          $config = Get-Content dictionary-server.json -Raw | ConvertFrom-Json
          if ($config.ca_file) {
            if (-not $env:SERVER_CA_CERTIFICATE) {
              throw "The DICTIONARY_SERVER_CA_PEM_B64 secret is required by dictionary-server.json"
            }
            [IO.File]::WriteAllBytes($config.ca_file, [Convert]::FromBase64String($env:SERVER_CA_CERTIFICATE))
          }

      - name: Verify tag matches application version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = python -c "from version import APP_VERSION; print(APP_VERSION)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match version.py ($version)"
          }

      - name: Run tests
        shell: pwsh
        run: |
          $env:HANZILAB_DICTIONARY_LOCAL = "1"
          python -m unittest discover -s tests -v

      - name: Build Windows application
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\build-release.ps1

      - name: Package update
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Compress-Archive -Path dist\HanziLab\* -DestinationPath release\HanziLab-Windows-x64.zip -CompressionLevel Fastest

      - uses: actions/upload-artifact@v4
        with:
          name: HanziLab-Windows-x64
          path: release/HanziLab-Windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release\HanziLab-Windows-x64.zip --verify-tag --notes "" --title "HanziLab ${{ github.ref_name }}"

